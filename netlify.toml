# Ela'nın 7. Sınıf Defteri — Netlify ayarları
[build]
  publish = "public"          # sitede görünen dosyalar
  command = ""                # derleme adımı yok (düz HTML/JSON)

[functions]
  directory = "netlify/functions"
  included_files = ["kaynaklar/**"]   # kitap metinleri yalnızca bot fonksiyonunda, sitede yayımlanmaz

# Konu dosyaları her zaman güncel gelsin
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
